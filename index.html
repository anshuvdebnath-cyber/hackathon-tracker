<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hackathon Tracker PWA</title>
    <meta name="description" content="A full-stack Neo-Brutalist Hackathon Tracker Progressive Web App (PWA) with Express backend, live countdowns, timeline, and deadline alerts." />
    <meta property="og:title" content="Hackathon Tracker PWA" />
    <meta property="og:description" content="A full-stack Neo-Brutalist Hackathon Tracker Progressive Web App (PWA) with Express backend, live countdowns, timeline, and deadline alerts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffd700" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:image" content="/icons/icon-512.png" />

    <!-- Google Fonts: Space Grotesk & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#f9f9f9] text-[#1a1c1c] antialiased selection:bg-[#ffd700] selection:text-[#1a1c1c]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[PWA] ServiceWorker registration successful with scope:', reg.scope))
            .catch(err => console.log('[PWA] ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
